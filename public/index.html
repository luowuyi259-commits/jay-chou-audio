<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jay Chou Audio</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    min-height: 100vh;
    background: #111;
    color: #eee;
    overflow: hidden;
  }

  /* 背景图片 */
  .bg-layer {
    position: fixed; inset: 0;
    background: url('bg.jpg') center/cover no-repeat;
    z-index: 0;
  }
  .bg-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1;
  }

  /* 主容器 */
  .app {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    height: 100vh;
    max-width: 800px; margin: 0 auto;
  }

  /* 顶栏 */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .header h1 {
    font-size: 22px; font-weight: 600;
    background: linear-gradient(135deg, #f0c040, #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .clock {
    font-size: 14px; color: rgba(255,255,255,0.6);
  }

  /* 聊天区域 */
  .chat-area {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  /* 消息气泡 */
  .message {
    max-width: 80%; padding: 10px 14px;
    border-radius: 12px; line-height: 1.6;
    font-size: 14px; animation: fadeIn 0.3s ease;
    word-break: break-word;
  }
  .message.user {
    align-self: flex-end;
    background: rgba(240, 192, 64, 0.85);
    color: #111;
    border-bottom-right-radius: 4px;
  }
  .message.ai {
    align-self: flex-start;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    color: #eee;
    border-bottom-left-radius: 4px;
  }
  .message.ai .label {
    font-size: 11px; color: rgba(255,255,255,0.5);
    margin-bottom: 4px; display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 打字指示器 */
  .typing {
    align-self: flex-start;
    padding: 10px 14px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    display: none;
  }
  .typing.show { display: flex; gap: 4px; }
  .typing span {
    width: 8px; height: 8px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* 输入区域 */
  .input-area {
    display: flex; gap: 8px;
    padding: 12px 16px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .input-area input {
    flex: 1; padding: 10px 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    color: #eee; font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-area input:focus {
    border-color: rgba(240, 192, 64, 0.5);
  }
  .input-area input::placeholder { color: rgba(255,255,255,0.35); }
  .input-area button {
    padding: 10px 20px;
    background: linear-gradient(135deg, #f0c040, #ff6b6b);
    border: none; border-radius: 20px;
    color: #111; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s;
  }
  .input-area button:hover { opacity: 0.85; }
  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 欢迎消息 */
  .welcome {
    text-align: center; padding: 40px 20px;
    color: rgba(255,255,255,0.5);
  }
  .welcome .emoji { font-size: 48px; margin-bottom: 12px; }
  .welcome p { font-size: 14px; }

  /* 连接状态 */
  .status-bar {
    text-align: center; font-size: 11px;
    padding: 4px; color: rgba(255,255,255,0.3);
  }
  .status-bar.connected { color: rgba(76, 175, 80, 0.7); }
  .status-bar.disconnected { color: rgba(244, 67, 54, 0.7); }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-overlay"></div>

<div class="app">
  <div class="header">
    <h1>🎵 Jay Chou Audio</h1>
    <div class="clock" id="clock"></div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="emoji">🎤</div>
      <p>嗨，我是 Jay Chou Audio 的 AI DJ<br>聊聊音乐，聊聊生活吧</p>
    </div>
  </div>

  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>

  <div class="status-bar disconnected" id="statusBar">⚠ 未连接</div>

  <div class="input-area">
    <input type="text" id="input" placeholder="说点什么..." autocomplete="off">
    <button id="sendBtn" disabled>发送</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
